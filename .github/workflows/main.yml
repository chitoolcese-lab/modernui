name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Fabric
            project: ModernUI-Fabric
            dir: fabric
          - name: NeoForge
            project: ModernUI-NeoForge
            dir: neoforge
          - name: Forge
            project: ModernUI-Forge
            dir: forge
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        shell: bash
        run: | # Si subiste el .zip al repo, se descomprime aqui if ls ./*.zip >/dev/null 2>&1; then unzip -q -o ./*.zip; fi G=$(find . -maxdepth 2 -name gradlew | head -1) if [ -z "$G" ]; then echo "No encuentro gradlew (¿falta el zip?)" | tee "$GITHUB_WORKSPACE/build.log"; exit 1; fi cd "$(dirname "$G")" chmod +x gradlew ./gradlew :${{ matrix.project }}:assemble --stacktrace --no-daemon 2>&1 | tee "$GITHUB_WORKSPACE/build.log" exit ${PIPESTATUS[0]} 
      - name: Upload jars
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ModernUI-${{ matrix.name }}-1.21.11
          path: "**/${{ matrix.dir }}/build/libs/*.jar"
          if-no-files-found: warn

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ matrix.name }}
          path: build.log
