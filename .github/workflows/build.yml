name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Fabric
            project: ModernUI-Fabric
          - name: NeoForge
            project: ModernUI-NeoForge
          - name: Forge
            project: ModernUI-Forge
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        shell: bash
        run: |
          Z=$(ls ./*.zip 2>/dev/null | sort -V | tail -1); if [ -n "$Z" ]; then echo "Usando $Z"; unzip -q -o "$Z"; fi
          G=$(find . -maxdepth 2 -name gradlew | head -1)
          if [ -z "$G" ]; then echo "No encuentro gradlew" | tee "$GITHUB_WORKSPACE/build.log"; exit 1; fi
          cd "$(dirname "$G")"
          chmod +x gradlew
          ./gradlew :${{ matrix.project }}:assemble --stacktrace --no-daemon 2>&1 | tee "$GITHUB_WORKSPACE/build.log"
          exit ${PIPESTATUS[0]}

      - name: Collect jars
        shell: bash
        run: |
          mkdir -p "$GITHUB_WORKSPACE/out"
          echo "=== jars encontrados en cualquier build/libs ==="
          find "$GITHUB_WORKSPACE" -path "*/build/libs/*.jar" -print
          # copia solo los del modulo actual (carpeta fabric / neoforge / forge)
          DIR=$(echo "${{ matrix.name }}" | tr '[:upper:]' '[:lower:]')
          find "$GITHUB_WORKSPACE" -path "*/$DIR/build/libs/*.jar" -exec cp -v {} "$GITHUB_WORKSPACE/out/" \;
          if [ -z "$(ls -A "$GITHUB_WORKSPACE/out")" ]; then
            echo "::error::El build termino pero no se genero ningun jar para ${{ matrix.name }}"
            echo "=== carpeta $DIR ==="; find "$GITHUB_WORKSPACE" -type d -name "$DIR" -maxdepth 3
            exit 1
          fi

      - name: Upload jars
        uses: actions/upload-artifact@v4
        with:
          name: ModernUI-${{ matrix.name }}-1.21.11
          path: ${{ github.workspace }}/out/*.jar
          if-no-files-found: error

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ matrix.name }}
          path: ${{ github.workspace }}/build.log
          if-no-files-found: ignore
